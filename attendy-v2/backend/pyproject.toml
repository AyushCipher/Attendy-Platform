[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# E501: line length handled by formatting, not worth failing CI over.
# B008: FastAPI's `Depends(...)` in a default argument is the documented, required
# pattern for its DI system, not the mutable-default-argument bug this rule targets.
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"alembic/*" = ["UP007", "UP035"]  # generated by `alembic init`, not hand-maintained
